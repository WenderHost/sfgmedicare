map $upstream_http_location $subdomain_location252738 {
	~^http(s)?://sfgmedicare\.com(?<path>.*)$ https://r7gp9799zx.apb.spinupwp.site$path;
	default $upstream_http_location;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;

	server_name r7gp9799zx.apb.spinupwp.site;

	ssl_certificate /etc/letsencrypt/live/r7gp9799zx.apb.spinupwp.site/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/r7gp9799zx.apb.spinupwp.site/privkey.pem;

	root /sites/sfgmedicare.com/files/web/;

	index index.html index.php;

	access_log /sites/sfgmedicare.com/logs/subdomain-access.log;
	error_log /sites/sfgmedicare.com/logs/subdomain-error.log;

	# Do not allow pages to be rendered in an iframe on external domains.
	add_header X-Frame-Options "SAMEORIGIN";

	# MIME sniffing prevention
	add_header X-Content-Type-Options "nosniff";

	# Enable cross-site scripting filter in supported browsers.
	add_header X-Xss-Protection "1; mode=block";

	# Limit referrer information sent with requests to third parties.
	add_header Referrer-Policy "strict-origin-when-cross-origin";

	# Filter URLs for sudomain requests
	sub_filter 'http://sfgmedicare.com' 'https://r7gp9799zx.apb.spinupwp.site';
	sub_filter '//sfgmedicare.com' '//r7gp9799zx.apb.spinupwp.site';
	sub_filter '\/\/sfgmedicare.com' '\/\/r7gp9799zx.apb.spinupwp.site';
	sub_filter_types text/css text/javascript application/javascript application/json text/plain;
	sub_filter_once off;

	fastcgi_hide_header Location;
	add_header Location $subdomain_location252738 always;

	include sites-available/sfgmedicare.com/server/*;
	# include global/https.conf;

	# Prevent access to hidden files
	location ~* /\.(?!well-known\/) {
		deny all;
	}

	# Prevent access to certain file extensions
	location ~ \.(ini|log|conf|blade.php)$ {
		deny all;
	}

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		try_files $uri =404;

		include fastcgi.conf;
		fastcgi_param HTTP_HOST sfgmedicare.com;
		fastcgi_pass unix:/run/php/php8.4-sfgmedicare.sock;

		include sites-available/sfgmedicare.com/location/*;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name r7gp9799zx.apb.spinupwp.site;

	return 301 https://$host$request_uri;
}


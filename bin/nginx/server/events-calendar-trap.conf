# Events Calendar crawler trap. Unbounded, uncacheable views; bot-only.
# Basecamp SFG 10306133408 / venus incidents 2026-09-01, 09-15.

# Query-string day view: no on-site link points here.
if ($arg_eventDisplay = "day") { return 410; }

# Any view pinned to an arbitrary date via eventDate.
if ($arg_eventDate) { return 410; }

# Deep pagination combined with a date (covers the &ical / &outlook-ical / &eventDisplay=past variants).
if ($request_uri ~ "/page/[0-9]+/\?.*tribe-bar-date=") { return 410; }
